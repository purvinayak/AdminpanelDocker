version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-panel-app
    ports:
      - "3001:3001"
      - "80:80"
    environment:
      - NODE_ENV=production
    volumes:
      # Optional: mount db.json for persistence
      - ./db.json:/app/db.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: JSON Server for development data
  json-server:
    image: clue/json-server
    container_name: json-server
    ports:
      - "3000:3000"
    volumes:
      - ./db.json:/data/db.json
    command: -w /data/db.json
    profiles:
      - dev
